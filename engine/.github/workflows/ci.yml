name: engine-ci

on:
  push:
    paths:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_MOCK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
