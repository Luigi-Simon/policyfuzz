[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "policyfuzz-backend"
version = "0.1.0"
description = "PolicyFuzz contract-first backend"
requires-python = ">=3.12"
dependencies = [
  "boto3",
  "fastapi",
  "pydantic>=2",
  "pydantic-settings",
  "uvicorn[standard]",
  "openai",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "httpx",
  "ruff",
  "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".", ".."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
